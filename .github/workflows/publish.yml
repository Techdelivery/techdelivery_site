name: Publish image

# Builds the static site into an nginx image and publishes it to GHCR.
# The cluster (k8s-titan) pins the resulting image by digest.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/techdelivery/techdelivery-site
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance attestations wrap the push in an index manifest; the
          # cluster pins a single-platform digest, so keep the image plain.
          provenance: false

      - name: Digest
        run: echo "Cluster pins this image by digest -> ${{ steps.build.outputs.digest }}"
