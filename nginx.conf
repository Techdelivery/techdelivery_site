# Served by nginxinc/nginx-unprivileged; the listener port must stay >1024
# because the container runs as uid 101 without CAP_NET_BIND_SERVICE.
server {
    listen     8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Security headers live in the snippet; see its header for why it is
    # included per-location instead of once at server level.
    include /etc/nginx/security-headers.conf;

    # The four files are unhashed, so keep asset cache times short: a deploy
    # must not leave visitors on a stale page for hours. The page itself is
    # revalidated every visit (no-cache), so a deploy is visible immediately.
    location ~* \.(css|js)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
