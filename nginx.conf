# Served by nginxinc/nginx-unprivileged; the listener port must stay >1024
# because the container runs as uid 101 without CAP_NET_BIND_SERVICE.
server {
    listen     8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Baseline response headers. HSTS is deliberately not set here: it is a
    # host-wide, sticky decision best made once TLS is settled.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The three files are unhashed, so keep cache times short: a deploy must
    # not leave visitors on a stale page for hours.
    location /styles.css {
        add_header Cache-Control "public, max-age=300";
    }
    location /app.js {
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
