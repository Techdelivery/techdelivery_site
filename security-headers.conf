# Security response headers, included from every location block.
#
# WHY A SNIPPET: nginx `add_header` does not merge across levels — a location
# that sets its own header (Cache-Control below) REPLACES the whole inherited
# list. Including this file per location is what keeps every response, assets
# included, carrying the full set.
#
# HSTS: one year, no includeSubDomains, no preload. Deliberately narrow:
# the apex techdelivery.es also carries mail and legacy OVH services this site
# does not control, and includeSubDomains would bind every one of them to
# HTTPS-only from the first visit. The cluster serves this host on HTTPS only
# (websecure pin), so the assertion is true for the host it is set on.
#
# CSP: the site is three local files with no third-party requests.
#   - script-src 'self' works because the only pre-first-paint script is the
#     external theme.js, not an inline block.
#   - form-action carries mailto: because the contact form submits to a
#     mailto: action built by app.js.
#   - img-src carries data: for inline SVG data URIs.
# If a future feature adds analytics, fonts, or embeds, this line must be
# widened deliberately — a CSP failure is a console error and a broken
# feature, so check the browser console after any third-party addition.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
